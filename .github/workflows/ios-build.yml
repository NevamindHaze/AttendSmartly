name: Build iOS App

on:
  push:
    paths:
      - "ios-app/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios-app/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Simulator App
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect Xcode scheme and configuration
        id: xcode-project
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -json -project ios-app/AttendSmartly.xcodeproj \
            > "$RUNNER_TEMP/attendsmartly-xcode-project.json"

          python3 - "$RUNNER_TEMP/attendsmartly-xcode-project.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as project_file:
              project = json.load(project_file)["project"]

          schemes = project.get("schemes", [])
          configurations = project.get("configurations", [])
          scheme = "AttendSmartly"
          configuration = "Debug"

          if scheme not in schemes:
              raise SystemExit(f"Expected scheme {scheme!r}; found: {schemes}")
          if configuration not in configurations:
              raise SystemExit(
                  f"Expected configuration {configuration!r}; found: {configurations}"
              )

          with open(sys.argv[2], "a", encoding="utf-8") as output_file:
              output_file.write(f"scheme={scheme}\n")
              output_file.write(f"configuration={configuration}\n")
          PY

      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios-app/AttendSmartly.xcodeproj \
            -scheme "${{ steps.xcode-project.outputs.scheme }}" \
            -configuration "${{ steps.xcode-project.outputs.configuration }}" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/AttendSmartlyDerivedData" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/attendsmartly-simulators.json"
          python3 - "$RUNNER_TEMP/attendsmartly-simulators.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as devices_file:
              devices_by_runtime = json.load(devices_file)["devices"]

          candidates = []
          for runtime, devices in devices_by_runtime.items():
              if "iOS-" not in runtime:
                  continue
              version = tuple(
                  int(part) for part in runtime.split("iOS-", 1)[1].split("-")
                  if part.isdigit()
              )
              for device in devices:
                  if device.get("isAvailable", True) and device.get("name", "").startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))

          if not candidates:
              raise SystemExit("No available iPhone simulator was found.")

          _, name, udid = max(candidates)
          with open(sys.argv[2], "a", encoding="utf-8") as output_file:
              output_file.write(f"destination=platform=iOS Simulator,id={udid}\n")
          print(f"Using {name} ({udid})")
          PY

      - name: Run iOS unit tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios-app/AttendSmartly.xcodeproj \
            -scheme AttendSmartly \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/AttendSmartlyTestDerivedData" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: AttendSmartly-iOS-Simulator
          path: ${{ runner.temp }}/AttendSmartlyDerivedData/Build/Products/Debug-iphonesimulator/AttendSmartly.app
          if-no-files-found: error

  build-device-ipa:
    name: Build Unsigned iOS Device IPA
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build for generic iOS device
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios-app/AttendSmartly.xcodeproj \
            -scheme AttendSmartly \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/AttendSmartlyDeviceDerivedData" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned iOS IPA
        shell: bash
        run: |
          set -euo pipefail
          package_path="$RUNNER_TEMP/AttendSmartlyIPA"
          app_path="$RUNNER_TEMP/AttendSmartlyDeviceDerivedData/Build/Products/Debug-iphoneos/AttendSmartly.app"
          mkdir -p "$package_path/Payload"
          cp -R "$app_path" "$package_path/Payload/AttendSmartly.app"
          (
            cd "$package_path"
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/AttendSmartly.ipa"
          )

      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: AttendSmartly-iOS-Unsigned-IPA
          path: ${{ runner.temp }}/AttendSmartly.ipa
          if-no-files-found: error

      # Publishes the newest IPA plus a SideStore source file to a fixed
      # pre-release called "ios-latest". Add this URL in SideStore once:
      # https://github.com/NevamindHaze/AttendSmartly/releases/download/ios-latest/source.json
      # It is a pre-release, so it never becomes the repo's "Latest release".
      - name: Publish to SideStore source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          ipa="$RUNNER_TEMP/AttendSmartly.ipa"
          tag="ios-latest"
          size=$(stat -f%z "$ipa")

          python3 - "$REPO" "$tag" "$RUN_NUMBER" "$size" > "$RUNNER_TEMP/source.json" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          repo, tag, run, size = sys.argv[1], sys.argv[2], sys.argv[3], int(sys.argv[4])
          base = f"https://github.com/{repo}/releases/download/{tag}"
          icon = f"https://raw.githubusercontent.com/{repo}/main/ios-app/AttendSmartly/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          version = {
              "version": f"1.0.{run}",
              "buildVersion": run,
              "date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "localizedDescription": f"Build {run} from GitHub Actions.",
              "downloadURL": f"{base}/AttendSmartly.ipa",
              "size": size,
              "minOSVersion": "17.0",
          }
          source = {
              "name": "AttendSmartly",
              "identifier": "com.agupta07505.attendsmartly.source",
              "subtitle": "Personal builds of AttendSmartly",
              "iconURL": icon,
              "apps": [{
                  "name": "AttendSmartly",
                  "bundleIdentifier": "com.agupta07505.attendsmartly",
                  "developerName": "Marshal",
                  "subtitle": "Track classes. Plan bunks. Attend smartly.",
                  "localizedDescription": "College attendance tracker.",
                  "iconURL": icon,
                  "tintColor": "#2E8569",
                  "version": version["version"],
                  "versionDate": version["date"],
                  "downloadURL": version["downloadURL"],
                  "size": size,
                  "versions": [version],
              }],
              "news": [],
          }
          print(json.dumps(source, indent=2))
          PY

          gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes || true
          gh release create "$tag" "$ipa" "$RUNNER_TEMP/source.json" \
            --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "AttendSmartly iOS (build $RUN_NUMBER)" \
            --notes "Automatic iOS build $RUN_NUMBER. Install it through SideStore." \
            --prerelease \
            --latest=false
