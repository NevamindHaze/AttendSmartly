name: Build iOS App

on:
  push:
    paths:
      - "AttendSmartly/**"
      - "AttendSmartly.xcodeproj/**"
      - "AttendSmartlyTests/**"
      - "AttendSmartlyWidget/**"
      - ".github/workflows/ios-build.yml"
      - ".github/sidestore/**"
  pull_request:
    paths:
      - "AttendSmartly/**"
      - "AttendSmartly.xcodeproj/**"
      - "AttendSmartlyTests/**"
      - "AttendSmartlyWidget/**"
      - ".github/workflows/ios-build.yml"
      - ".github/sidestore/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Simulator App
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect Xcode scheme and configuration
        id: xcode-project
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -json -project AttendSmartly.xcodeproj \
            > "$RUNNER_TEMP/attendsmartly-xcode-project.json"

          python3 - "$RUNNER_TEMP/attendsmartly-xcode-project.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as project_file:
              project = json.load(project_file)["project"]

          schemes = project.get("schemes", [])
          configurations = project.get("configurations", [])
          scheme = "AttendSmartly"
          configuration = "Debug"

          if scheme not in schemes:
              raise SystemExit(f"Expected scheme {scheme!r}; found: {schemes}")
          if configuration not in configurations:
              raise SystemExit(
                  f"Expected configuration {configuration!r}; found: {configurations}"
              )

          with open(sys.argv[2], "a", encoding="utf-8") as output_file:
              output_file.write(f"scheme={scheme}\n")
              output_file.write(f"configuration={configuration}\n")
          PY

      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project AttendSmartly.xcodeproj \
            -scheme "${{ steps.xcode-project.outputs.scheme }}" \
            -configuration "${{ steps.xcode-project.outputs.configuration }}" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/AttendSmartlyDerivedData" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/attendsmartly-simulators.json"
          python3 - "$RUNNER_TEMP/attendsmartly-simulators.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as devices_file:
              devices_by_runtime = json.load(devices_file)["devices"]

          candidates = []
          for runtime, devices in devices_by_runtime.items():
              if "iOS-" not in runtime:
                  continue
              version = tuple(
                  int(part) for part in runtime.split("iOS-", 1)[1].split("-")
                  if part.isdigit()
              )
              for device in devices:
                  if device.get("isAvailable", True) and device.get("name", "").startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))

          if not candidates:
              raise SystemExit("No available iPhone simulator was found.")

          _, name, udid = max(candidates)
          with open(sys.argv[2], "a", encoding="utf-8") as output_file:
              output_file.write(f"destination=platform=iOS Simulator,id={udid}\n")
          print(f"Using {name} ({udid})")
          PY

      - name: Run iOS unit tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project AttendSmartly.xcodeproj \
            -scheme AttendSmartly \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/AttendSmartlyTestDerivedData" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: AttendSmartly-iOS-Simulator
          path: ${{ runner.temp }}/AttendSmartlyDerivedData/Build/Products/Debug-iphonesimulator/AttendSmartly.app
          if-no-files-found: error

  build-device-ipa:
    name: Build Unsigned iOS Device IPA
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build for generic iOS device
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project AttendSmartly.xcodeproj \
            -scheme AttendSmartly \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/AttendSmartlyDeviceDerivedData" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned iOS IPA
        shell: bash
        run: |
          set -euo pipefail
          package_path="$RUNNER_TEMP/AttendSmartlyIPA"
          app_path="$RUNNER_TEMP/AttendSmartlyDeviceDerivedData/Build/Products/Debug-iphoneos/AttendSmartly.app"
          mkdir -p "$package_path/Payload"
          cp -R "$app_path" "$package_path/Payload/AttendSmartly.app"

          # Ad-hoc sign the widget and the app with their entitlements so that
          # SideStore can see (and set up) the App Group they share.
          app="$package_path/Payload/AttendSmartly.app"
          widget="$app/PlugIns/AttendSmartlyWidget.appex"
          if [ -d "$widget" ]; then
            codesign --force --sign - --timestamp=none \
              --entitlements AttendSmartlyWidget/AttendSmartlyWidget.entitlements "$widget"
          fi
          codesign --force --sign - --timestamp=none \
            --entitlements AttendSmartly/AttendSmartly.entitlements "$app"
          codesign -d --entitlements - "$app" || true
          (
            cd "$package_path"
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/AttendSmartly.ipa"
          )

      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: AttendSmartly-iOS-Unsigned-IPA
          path: ${{ runner.temp }}/AttendSmartly.ipa
          if-no-files-found: error

      # Each build gets its own pre-release ("ios-build-<n>") holding its IPA, and the
      # fixed pre-release "ios-latest" holds the SideStore source file. Because the
      # source points at that build's own IPA, a stale copy of the source still
      # downloads the build it describes. Add this URL in SideStore once:
      # https://github.com/NevamindHaze/AttendSmartly/releases/download/ios-latest/source.json
      # These are pre-releases, so they never become the repo's "Latest release".
      - name: Publish to SideStore source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          ipa="$RUNNER_TEMP/AttendSmartly.ipa"
          tag="ios-latest"
          build_tag="ios-build-$RUN_NUMBER"
          size=$(stat -f%z "$ipa")

          # The previous source, so its version history carries over.
          gh release download "$tag" --repo "$REPO" --pattern source.json \
            --output "$RUNNER_TEMP/previous-source.json" 2>/dev/null || echo "{}" > "$RUNNER_TEMP/previous-source.json"

          python3 - "$REPO" "$build_tag" "$RUN_NUMBER" "$size" "$RUNNER_TEMP/previous-source.json" \
            > "$RUNNER_TEMP/source.json" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          repo, build_tag, run, size, previous_path = sys.argv[1:6]
          size = int(size)
          raw = f"https://raw.githubusercontent.com/{repo}/main"
          meta = Path(".github/sidestore")

          def read(name, fallback=""):
              path = meta / name
              return path.read_text(encoding="utf-8").strip() if path.exists() else fallback

          icon = f"{raw}/AttendSmartly/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          screenshots = [
              {"imageURL": f"{raw}/docs/screenshots/{name}.png", "width": 600, "height": 1304}
              for name in ("home", "today", "subjects")
          ]
          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          version = {
              "version": f"1.0.{run}",
              "buildVersion": run,
              "date": now,
              "localizedDescription": read("whats-new.md", "Bug fixes and improvements."),
              "downloadURL": f"https://github.com/{repo}/releases/download/{build_tag}/AttendSmartly.ipa",
              "size": size,
              "minOSVersion": "17.0",
          }

          # Keep the last few builds that still have their own download page.
          try:
              previous = json.loads(Path(previous_path).read_text(encoding="utf-8"))
              old_versions = previous["apps"][0].get("versions", [])
          except Exception:
              old_versions = []
          history = [
              v for v in old_versions
              if "/ios-build-" in v.get("downloadURL", "") and v.get("buildVersion") != run
          ]
          versions = ([version] + history)[:5]

          try:
              news = json.loads(read("news.json", "[]"))
          except json.JSONDecodeError:
              news = []

          source = {
              "name": "AttendSmartly",
              "identifier": "com.agupta07505.attendsmartly.source",
              "subtitle": "Personal builds of AttendSmartly for iOS",
              "description": "Official builds of AttendSmartly for iOS, published automatically from GitHub.",
              "iconURL": icon,
              "headerURL": f"{raw}/docs/sidestore/header.png",
              "website": f"https://github.com/{repo}",
              "tintColor": "#2E8569",
              "featuredApps": ["com.agupta07505.attendsmartly"],
              "apps": [{
                  "name": "AttendSmartly",
                  "bundleIdentifier": "com.agupta07505.attendsmartly",
                  "developerName": "Marshal",
                  "subtitle": "Track classes. Plan bunks. Attend smartly.",
                  "localizedDescription": read("about.md", "College attendance tracker."),
                  "iconURL": icon,
                  "tintColor": "#2E8569",
                  "category": "utilities",
                  "screenshots": screenshots,
                  "screenshotURLs": [s["imageURL"] for s in screenshots],
                  "version": version["version"],
                  "versionDate": version["date"],
                  "versionDescription": version["localizedDescription"],
                  "downloadURL": version["downloadURL"],
                  "size": size,
                  "versions": versions,
              }],
              "news": news,
          }
          print(json.dumps(source, indent=2, ensure_ascii=False))
          PY

          # 1. This build's own release with its IPA (must exist before the source points at it).
          gh release delete "$build_tag" --repo "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$build_tag" "$ipa" \
            --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "AttendSmartly iOS build $RUN_NUMBER" \
            --notes "Automatic iOS build $RUN_NUMBER. Install it through SideStore." \
            --prerelease \
            --latest=false

          # 2. Update the source file in place, so its link never goes missing.
          if ! gh release view "$tag" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$REPO" --target "$GITHUB_SHA" \
              --title "AttendSmartly iOS (SideStore source)" \
              --notes "SideStore source for AttendSmartly." --prerelease --latest=false
          fi
          gh release upload "$tag" "$RUNNER_TEMP/source.json" "$ipa" --repo "$REPO" --clobber
          gh release edit "$tag" --repo "$REPO" \
            --title "AttendSmartly iOS (latest: build $RUN_NUMBER)" \
            --notes "SideStore source for AttendSmartly. Latest build: $RUN_NUMBER."

          # 3. Keep only the five newest per-build releases.
          gh api "repos/$REPO/releases?per_page=100" --jq '.[].tag_name' \
            | grep '^ios-build-' | sort -t- -k3 -n -r | tail -n +6 \
            | while read -r old; do
                gh release delete "$old" --repo "$REPO" --cleanup-tag --yes || true
              done
